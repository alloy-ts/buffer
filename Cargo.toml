[package]
name = "my-addon-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"
rocket = { version = "0.5.1", optional = true }

[build-dependencies]
napi-build = "2"

[features]
rocket = ["dep:rocket"]
