[package]
name = "alloy-buffer-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12.1"
napi = { version = "3", features = ["napi6", "async", "tokio_rt"] }
napi-derive = "3"
rocket = { version = "0.5.1", features = ["json", "secrets"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
napi-build = "2"
